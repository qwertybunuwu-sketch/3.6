name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          if [ ! -f settings.gradle ]; then
            z=$(ls *.zip | head -1)
            unzip -q "$z" -d unpacked
            d=$(dirname "$(find unpacked -name settings.gradle | head -1)")
            cp -a "$d"/. .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: airdash-mod
          path: build/libs/*.jar
